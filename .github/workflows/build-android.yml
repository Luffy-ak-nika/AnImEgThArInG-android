name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      # ── 1. Checkout ─────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Node.js ──────────────────────────────────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # ── 3. Rust ─────────────────────────────────────────────────────────────
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Add Android Rust targets
        run: |
          rustup target add aarch64-linux-android
          rustup target add armv7-linux-androideabi
          rustup target add i686-linux-android
          rustup target add x86_64-linux-android

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-android-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-android-

      # ── 4. Java ─────────────────────────────────────────────────────────────
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # ── 5. Android SDK ──────────────────────────────────────────────────────
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: |
          sdkmanager --install \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;26.3.11579264" \
            "cmake;3.22.1" || true

      - name: Set Android environment variables
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "NDK_HOME=$ANDROID_HOME/ndk/26.3.11579264" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/26.3.11579264" >> $GITHUB_ENV
          NDK_BIN=$ANDROID_HOME/ndk/26.3.11579264/toolchains/llvm/prebuilt/linux-x86_64/bin
          echo "CC_aarch64_linux_android=$NDK_BIN/aarch64-linux-android24-clang" >> $GITHUB_ENV
          echo "AR_aarch64_linux_android=$NDK_BIN/llvm-ar" >> $GITHUB_ENV

      # ── 6. Tauri CLI ─────────────────────────────────────────────────────────
      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      # ── 7. Install npm dependencies ─────────────────────────────────────────
      - name: Install frontend dependencies
        run: npm install

      # ── 8. DIAGNOSTIC: Rust type-check for Android ──────────────────────────
      - name: Diagnose Android Rust compilation
        run: |
          echo "====== cargo check for aarch64-linux-android ======"
          cargo check \
            --manifest-path src-tauri/Cargo.toml \
            --target aarch64-linux-android \
            --lib \
            2>&1 | head -300 || true
          echo "====== END DIAGNOSTIC ======"
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          NDK_HOME: ${{ env.NDK_HOME }}
          ANDROID_NDK_ROOT: ${{ env.NDK_HOME }}
          CC_aarch64_linux_android: ${{ env.CC_aarch64_linux_android }}
          AR_aarch64_linux_android: ${{ env.AR_aarch64_linux_android }}

      # ── 9. Initialize Android project ───────────────────────────────────────
      - name: Initialize Tauri Android project
        run: cargo tauri android init
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          NDK_HOME: ${{ env.NDK_HOME }}

      # ── 10. Patch generated Android files ────────────────────────────────────
      - name: Patch Android files (back button + keyboard resize)
        run: |
          MAIN_ACT=$(find src-tauri/gen/android -name "MainActivity.kt" | head -1)
          MANIFEST=$(find src-tauri/gen/android -name "AndroidManifest.xml" | head -1)
          echo "Patching: $MAIN_ACT"
          python3 .github/scripts/patch_main.py "$MAIN_ACT"
          echo "Patching: $MANIFEST"
          python3 .github/scripts/patch_manifest.py "$MANIFEST"

      # ── 11. Build APK ─────────────────────────────────────────────────────────
      - name: Build Android APK (debug)
        run: cargo tauri android build --debug --target aarch64
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          NDK_HOME: ${{ env.NDK_HOME }}
          CC_aarch64_linux_android: ${{ env.CC_aarch64_linux_android }}
          AR_aarch64_linux_android: ${{ env.AR_aarch64_linux_android }}

      # ── 12. Find and upload APK ──────────────────────────────────────────────
      - name: Find APK file
        id: find_apk
        run: |
          APK_PATH=$(find src-tauri/gen/android -name "*.apk" | head -1)
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT
          echo "Found APK: $APK_PATH"
          ls -lh "$APK_PATH" 2>/dev/null || echo "APK not found"

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: AnImEgThArInG-android-debug
          path: |
            src-tauri/gen/android/**/*.apk
          retention-days: 30
          if-no-files-found: error
